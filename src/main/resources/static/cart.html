<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h1>Your Cart</h1>
  <div id="content"></div>
</main>
<script src="js/api.js"></script>
<script>
  renderNav();
  if (requireLogin()) load();

  async function load() {
    const box = document.getElementById('content');
    const items = await api('/cart');
    if (!items.length) {
      box.innerHTML = '<div class="card empty"><p>Your cart is empty.</p><a class="btn mt" href="index.html">Start shopping</a></div>';
      return;
    }
    const subtotal = items.reduce((s, i) => s + i.product.price * i.quantity, 0);
    const shipping = 0;
    box.innerHTML = `
      <div class="layout">
        <div class="card">
          ${items.map(i => `
            <div class="cart-item">
              <a href="product.html?id=${i.product.id}">${productImg(i.product)}</a>
              <div>
                <a class="name" href="product.html?id=${i.product.id}" style="font-weight:600;color:var(--text)">${esc(i.product.name)}</a>
                <div class="muted" style="font-size:.9rem">${money(i.product.price)} each</div>
                <div class="qty mt" style="margin-top:8px">
                  <button onclick="setQty(${i.id}, ${i.quantity - 1})">−</button>
                  <input type="number" value="${i.quantity}" min="1" max="${i.product.stock}" onchange="setQty(${i.id}, +this.value)">
                  <button onclick="setQty(${i.id}, ${i.quantity + 1})">+</button>
                </div>
              </div>
              <div style="text-align:right">
                <div class="price">${money(i.product.price * i.quantity)}</div>
                <button class="btn small outline mt" style="margin-top:8px" onclick="removeItem(${i.id})">Remove</button>
              </div>
            </div>`).join('')}
          <button class="btn small danger mt" onclick="clearCart()">Clear cart</button>
        </div>
        <div class="card summary">
          <h2>Order Summary</h2>
          <div class="line"><span>Items (${items.reduce((s, i) => s + i.quantity, 0)})</span><span>${money(subtotal)}</span></div>
          <div class="line"><span>Shipping</span><span>${shipping ? money(shipping) : 'FREE'}</span></div>
          <div class="line total"><span>Total</span><span>${money(subtotal + shipping)}</span></div>
          <a class="btn block mt" href="checkout.html">Proceed to Checkout</a>
        </div>
      </div>`;
  }

  async function setQty(id, q) {
    if (q < 1) return removeItem(id);
    try { await api('/cart/' + id, { method: 'PUT', body: { quantity: q } }); }
    catch (e) { toast(e.message, 'error'); }
    load(); refreshCartCount();
  }
  async function removeItem(id) {
    await api('/cart/' + id, { method: 'DELETE' });
    toast('Item removed'); load(); refreshCartCount();
  }
  async function clearCart() {
    await api('/cart', { method: 'DELETE' });
    load(); refreshCartCount();
  }
</script>
</body>
</html>
