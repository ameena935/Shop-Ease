spring.application.name=ShopEase
server.port=8080

# ==============================================================================
# DATABASE CONFIGURATION (Default: H2 Embedded File Database named ecommerce_db)
# ==============================================================================
# Works out-of-the-box with ZERO database installation required!
# Data persists locally in ./data/ecommerce_db.mv.db
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================================
# MYSQL CONFIGURATION (As requested in PDF Requirements: database named ecommerce_db)
# ==============================================================================
# To use MySQL instead of H2:
# 1. Comment out the 4 H2 lines above.
# 2. Uncomment the 4 MySQL lines below.
# 3. Ensure your MySQL server is running on port 3306 with user 'root' and your password.
#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=root

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Set to true if you want the interactive console menu to launch on startup
app.console.enabled=false
